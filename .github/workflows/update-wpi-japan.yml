name: Update Japan WPI ports

on:
  workflow_dispatch:

  schedule:
    - cron: "0 19 1 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download NGA WPI CSV
        run: |
          mkdir -p work

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 180 \
            --insecure \
            --output work/UpdatedPub150.csv \
            "https://msi.nga.mil/api/publications/download?type=view&key=16920959/SFH00000/UpdatedPub150.csv"

          echo "===== downloaded file ====="
          ls -lh work/UpdatedPub150.csv

          echo "===== first 3 lines ====="
          head -3 work/UpdatedPub150.csv

      - name: Build Japan WPI CSV
        run: |
          python scripts/update_wpi_japan.py work/UpdatedPub150.csv

      - name: Show generated CSV
        run: |
          echo "===== line count ====="
          wc -l data/ports/wpi-japan.csv

          echo "===== first 20 lines ====="
          head -20 data/ports/wpi-japan.csv

      - name: Commit generated CSV
        run: |
          if git diff --quiet -- data/ports/wpi-japan.csv; then
            echo "WPIデータに変更はありません。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ports/wpi-japan.csv
          git commit -m "Update Japan WPI port data"
          git push
